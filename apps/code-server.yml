---
services:
  code-server:
    build:
      dockerfile: ./code-server.df
    container_name: code-server
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - PROXY_DOMAIN=code.willow.network #optional
      - DEFAULT_WORKSPACE=/config/workspace
    volumes:
      - ../volumes/code-server/config:/config
    ports:
      - 8524:8443
    restart: unless-stopped

