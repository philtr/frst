services:
  photo-booth:
    container_name: photo-booth
    image: ghcr.io/philtr/photo-booth:latest
    restart: unless-stopped
    ports:
      - 8867:3000
    environment:
      - DATABASE_URL=sqlite3:/rails/storage/production.sqlite3
      - MAILER_HOST=booth.philtr.dev
      - MAILER_FROM=Photo Booth <no-reply@mail.philtr.dev>
      - RAILS_ENV=production
      - RAILS_LOG_LEVEL=info
      - REGISTRATION_ENABLED=false
    volumes:
      - ../volumes/photo-booth/storage:/rails/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
